snapshots:
  - name: snap_patient_care_gaps
    relation: ref('agg_patient_care_gaps')
    description: >
      The audit history of every member care gap. Each time the snapshot runs, it records any gap that
      opened, any change to a gap's definition or latest qualifying event, and any gap that closed.
      Closed gaps are kept as rows with dbt_is_deleted = 'True'; nothing is overwritten.


      Answers "what did we know about this member's gaps on a given date, and when did that change?"
      without restoring backups. Pair the timestamps here with the git history of
      hedis_measure_definitions to show which rule change caused a gap to open or close.
    config:
      schema: snapshots
      unique_key: care_gap_key
      strategy: check
      check_cols:
        - care_gap_name
        - latest_relevant_event_date
        - care_gap_status
      hard_deletes: new_record
      meta:
        owner: Quality Improvement
        contains_phi: true
    columns:
      - name: care_gap_key
        description: The gap being tracked (patient_id plus care_gap_code). One gap can have several rows over time.
      - name: patient_id
        description: FHIR Patient id of the member.
      - name: care_gap_code
        description: Stable gap identifier, for example diabetes_monitoring.
      - name: care_gap_name
        description: Gap description as it read at the time, including the lookback window then in force. A rule change that alters the name creates a new row.
      - name: latest_relevant_event_date
        description: Member's most recent qualifying event for the gap at the time of the row.
      - name: care_gap_status
        description: Status at the time of the row. Always 'open' while the gap exists.
      - name: dbt_valid_from
        description: When this version of the gap was recorded. For the first row of a gap, this is when the gap was first seen.
      - name: dbt_valid_to
        description: When this version was replaced by a newer row. Null means it is the current version.
      - name: dbt_is_deleted
        description: "'True' on the row recording that the gap closed (dropped out of agg_patient_care_gaps), 'False' otherwise."
      - name: dbt_updated_at
        description: Timestamp dbt used to version this row.
      - name: dbt_scd_id
        description: Unique id for each row in the snapshot, generated by dbt.
