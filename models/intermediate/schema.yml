version: 2

models:
  - name: int_fhir_patient
    description: Patient records prepared for dimensional modeling.
    columns:
      - name: patient_id
        description: Joinable patient id derived from the FHIR Patient resource id.
        data_tests:
          - not_null
          - unique

  - name: int_fhir_encounter
    description: Encounter records with patient references normalized into joinable ids.
    columns:
      - name: encounter_id
        description: Joinable encounter id.
        data_tests:
          - not_null
          - unique
      - name: patient_id
        description: Patient id parsed from the FHIR subject reference.
        data_tests:
          - relationships:
              arguments:
                to: ref('int_fhir_patient')
                field: patient_id

  - name: int_fhir_observation
    description: Observation records with patient and encounter references normalized into joinable ids.
