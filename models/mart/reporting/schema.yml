version: 2

models:
  - name: dim_condition
    description: Conformed condition dimension with one row per condition coding and display combination observed in the condition fact.
    columns:
      - name: condition_key
        description: Stable key for the condition coding and display combination.
        data_tests:
          - not_null
          - unique

  - name: dim_encounter_class
    description: Conformed encounter class dimension with one row per encounter class code and display combination.
    columns:
      - name: encounter_class_key
        description: Stable key for the encounter class coding and display combination.
        data_tests:
          - not_null
          - unique

  - name: dim_medication
    description: Conformed medication dimension with one row per medication coding and display combination observed in medication requests.
    columns:
      - name: medication_key
        description: Stable key for the medication coding and display combination.
        data_tests:
          - not_null
          - unique

  - name: dim_observation
    description: Conformed observation dimension with one row per observation coding, category, and display combination.
    columns:
      - name: observation_key
        description: Stable key for the observation coding, category, and display combination.
        data_tests:
          - not_null
          - unique

  - name: dim_procedure
    description: Conformed procedure dimension with one row per procedure coding, category, and display combination.
    columns:
      - name: procedure_key
        description: Stable key for the procedure coding, category, and display combination.
        data_tests:
          - not_null
          - unique

  - name: agg_patient_clinical_profile
    description: Patient-level aggregate profile with demographics, clinical activity counts, latest event dates, and high-level chronic condition flags.
    columns:
      - name: patient_id
        description: Primary key for the patient clinical profile.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id

  - name: agg_monthly_clinical_activity
    description: Monthly clinical activity aggregate by activity month, gender, and age band.
    columns:
      - name: monthly_activity_key
        description: Primary key for the monthly activity, gender, and age-band grain.
        data_tests:
          - not_null
          - unique

  - name: agg_quality_measure_summary
    description: Quality measure aggregate by measure, gender, and age band using analytics-oriented denominator and numerator flags anchored to the latest observed clinical event date.
    columns:
      - name: quality_measure_key
        description: Primary key for the quality measure, gender, and age-band grain.
        data_tests:
          - not_null
          - unique

  - name: agg_patient_care_gaps
    description: Patient care-gap aggregate with one row per open heuristic gap per patient anchored to the latest observed clinical event date.
    columns:
      - name: care_gap_key
        description: Primary key for the patient and care-gap code grain.
        data_tests:
          - not_null
          - unique
      - name: patient_id
        description: Foreign key to the patient dimension.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id

  - name: agg_patient_quality_measure_events
    description: >
      One row per patient per quality measure with the latest observation that satisfies the measure,
      matched on the governed LOINC value set (seeds/hedis_measure_value_sets.csv) or the governed
      observation name pattern (seeds/hedis_measure_definitions.csv). This is the single place
      measure-qualifying logic lives; agg_patient_care_gaps and agg_quality_measure_summary both read it.
    columns:
      - name: patient_measure_key
        description: Primary key for the patient and measure grain.
        data_tests:
          - not_null
          - unique
      - name: patient_id
        description: Foreign key to the patient dimension.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_patient')
                field: patient_id
      - name: measure_id
        description: Governed measure identifier from hedis_measure_definitions.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hedis_measure_definitions')
                field: measure_id
      - name: latest_qualifying_event_date
        description: Most recent observation date that satisfies the measure for this patient.

unit_tests:
  - name: test_care_gaps_diabetes_a1c_lookback_rule
    description: >
      Encodes the diabetes A1c monitoring rule as an executable specification.
      Given a reporting as-of date of 2026-06-30 and the lookback in hedis_measure_definitions (6 months):
      an A1c 7 calendar months old opens a gap, an A1c 4 months old does not, and an A1c exactly
      6 calendar months old is treated as compliant. If the governed rule changes, this test fails and
      shows exactly which patients flip, so the change has to be reviewed and acknowledged in the PR.
    model: agg_patient_care_gaps
    given:
      - input: ref('dim_patient')
        rows:
          - {patient_id: p_a1c_overdue, gender: female, age_years: 50, age_band: "45-64"}
          - {patient_id: p_a1c_current, gender: male, age_years: 50, age_band: "45-64"}
          - {patient_id: p_a1c_boundary, gender: female, age_years: 50, age_band: "45-64"}
      - input: ref('fct_encounter')
        rows:
          - {patient_id: p_a1c_overdue, encounter_date: "2026-06-30"}
          - {patient_id: p_a1c_current, encounter_date: "2026-06-30"}
          - {patient_id: p_a1c_boundary, encounter_date: "2026-06-30"}
      - input: ref('fct_observation')
        rows: []
      - input: ref('fct_immunization')
        rows:
          - {patient_id: p_a1c_overdue, occurrence_date: "2026-05-01", is_completed_immunization: true}
          - {patient_id: p_a1c_current, occurrence_date: "2026-05-01", is_completed_immunization: true}
          - {patient_id: p_a1c_boundary, occurrence_date: "2026-05-01", is_completed_immunization: true}
      - input: ref('fct_condition')
        rows:
          - {patient_id: p_a1c_overdue, condition_name: "Diabetes mellitus type 2"}
          - {patient_id: p_a1c_current, condition_name: "Diabetes mellitus type 2"}
          - {patient_id: p_a1c_boundary, condition_name: "Diabetes mellitus type 2"}
      - input: ref('fct_medicationrequest')
        rows: []
      - input: ref('agg_patient_quality_measure_events')
        rows:
          - {patient_id: p_a1c_overdue, measure_id: adult_blood_pressure, latest_qualifying_event_date: "2026-06-01"}
          - {patient_id: p_a1c_current, measure_id: adult_blood_pressure, latest_qualifying_event_date: "2026-06-01"}
          - {patient_id: p_a1c_boundary, measure_id: adult_blood_pressure, latest_qualifying_event_date: "2026-06-01"}
          - {patient_id: p_a1c_overdue, measure_id: diabetes_a1c_monitoring, latest_qualifying_event_date: "2025-11-15"}
          - {patient_id: p_a1c_current, measure_id: diabetes_a1c_monitoring, latest_qualifying_event_date: "2026-02-15"}
          - {patient_id: p_a1c_boundary, measure_id: diabetes_a1c_monitoring, latest_qualifying_event_date: "2025-12-31"}
      - input: ref('hedis_measure_definitions')
        rows:
          - {measure_id: adult_blood_pressure, measure_label: blood pressure observation, lookback_months: 12, min_age_years: 18, max_age_years: null}
          - {measure_id: diabetes_a1c_monitoring, measure_label: A1c observation, lookback_months: 6, min_age_years: null, max_age_years: null}
    expect:
      rows:
        - {patient_id: p_a1c_overdue, care_gap_code: diabetes_monitoring, care_gap_name: "Diabetes cohort without A1c observation in the last 6 months"}
